# DefectNet fine-tune template: one GPU, your frames in train.xyz (make them with `defectnet-data`).
# Run from this folder:   defectnet-train -cn finetune.yaml   (tace-train with the periodic QEq electrostatics)
# Change only what you need, most often:
#   finetune_from_model      path to DefectNet-v1.0.pt
#   dataset.train_file       your frames; dataset.valid_file or dataset.valid_ratio for the validation set
#   trainer.max_steps        and scheduler.first_cycle_steps (keep the two equal: one annealed cosine cycle)
#   optimizer.lr, scheduler.max_lr   1e-5 keeps the pretrained accuracy; raise to 2e-5..5e-5 for a new chemistry
#   trainer.devices          more GPUs on one node (DDP)
# Keep the model block as it is: it has to match the weights (the QEq head comes with them). The loss weights are
# the ones DefectNet was trained with (energy per atom 50, forces 5, stress 0.5, whole-cell energy 0.01).
defaults:
- _self_
resume_from_model: null
finetune_from_model: DefectNet-v1.0.pt
finetune: null
misc:
  project_name: defectnet_finetune
  global_seed: 42
  device: cuda
  allow_tf32: true
  ignore_warning: true
  log_level: debug
  env:
    WANDB_MODE: offline
  LossSkipController:
    enable: true
    manual_threshold: 1000000.0
    start_step: 200
    ema_window: 100
    multiplier: 1000
    skip_nan: true
    skip_large: true
trainer:
  _target_: lightning.Trainer
  num_nodes: 1
  accelerator: auto
  devices: 1
  max_time: '90:00:00:00'
  max_epochs: 1000
  max_steps: 2000
  min_epochs: 1
  precision: 32
  strategy: auto
  gradient_clip_val: 10.0
  accumulate_grad_batches: 1
  enable_progress_bar: true
  log_every_n_steps: 20
  enable_model_summary: true
  enable_checkpointing: true
  check_val_every_n_epoch: 1
  val_check_interval: 500
  limit_val_batches: null
  detect_anomaly: false
  inference_mode: false
  deterministic: false
callbacks:
  checkpoint_step:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: checkpoints
    filename: TACE-full-{epoch}-{step}
    save_top_k: 1
    save_last: true
    every_n_train_steps: 500
    save_weights_only: false
    auto_insert_metric_name: false
    verbose: false
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    verbose: true
    log_rank_zero_only: true
    monitor: ${synth_metric.monitor_metric_name}
    patience: 50
  ema:
    _target_: tace.utils.callbacks.EMACallback
    decay: 0.999
    use_num_updates: true
  checkpoint_epoch:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: checkpoints_epoch
    filename: TACE-{${misc.project_name}-{epoch}-{step}-{${synth_metric.monitor_metric_name}:.4f}
    save_top_k: -1
    save_last: true
    every_n_epochs: 10
    save_weights_only: false
    auto_insert_metric_name: false
    verbose: false
dataset:
  type: ase
  split_seed: ${misc.global_seed}
  train_file: train.xyz
  valid_file: null
  valid_ratio: 0.1
  valid_from_index: false
  no_valid_set: false
  neighborlist_backend: matscipy
  storage_mode: memory
  shard_dirs:
  - graphCache
  shard_size: 100000
  cache_size: 1024
  avg_graph_size_in_KB: 200
  lmdb_wait_timeout: 86400
  force_dtype: null
  keys:
    fidelity_idx_key: fidelity_idx
    energy_key: energy
    forces_key: forces
    stress_key: stress
    virials_key: virials
    charges_key: charges
    total_charge_key: total_charge
    direct_forces_key: forces
    direct_stress_key: stress
    direct_virials_key: virials
    polarization_key: polarization
    direct_dipole_key: dipole
    conservative_dipole_key: dipole
    direct_polarizability_key: polarizability
    conservative_polarizability_key: polarizability
    born_effective_charges_key: born_effective_charges
    electric_field_key: electric_field
    magnetic_field_key: magnetic_field
    initial_collinear_magmoms_key: initial_collinear_magmoms
    initial_noncollinear_magmoms_key: initial_noncollinear_magmoms
    final_collinear_magmoms_key: final_collinear_magmoms
    final_noncollinear_magmoms_key: final_noncollinear_magmoms
    total_collinear_magmoms_key: total_collinear_magmoms
    total_noncollinear_magmoms_key: total_noncollinear_magmoms
    collinear_magnetic_forces_key: collinear_magnetic_forces
    noncollinear_magnetic_forces_key: noncollinear_magnetic_forces
  train_dataloader:
    _target_: torch_geometric.loader.DataLoader
    batch_size: 1
    shuffle: true
    drop_last: false
    num_workers: 2
  valid_dataloader:
    _target_: torch_geometric.loader.DataLoader
    batch_size: 1
    shuffle: false
    drop_last: false
    num_workers: 1
  test_dataloader: ${dataset.valid_dataloader}
optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-05
  weight_decay: 1.0e-08
scheduler:
  _target_: tace.utils.lr_scheduler.CosineAnnealingWarmupRestarts
  first_cycle_steps: 2000
  cycle_mult: 1.0
  max_lr: 1.0e-05
  min_lr: 1.0e-06
  warmup_steps: 100
  gamma: 1.0
  last_epoch: -1
  extra:
    interval: step
    frequency: 1
synth_metric:
  monitor_metric_name: val/synth_metric
  val/energy_mae: 1.0
  val/energy_per_atom_mae: 5.0
  val/forces_mae: 5.0
  val/stress_mae: 2.5
  val/energy_per_atom_rmse: 1.0
  val/forces_rmse: 1.0
  val/stress_rmse: 1.0
loss:
  _target_: tace.utils.loss.NormalLoss
  loss_property:
  - energy
  - forces
  - stress
  loss_function_name:
  - mse_energy_per_atom
  - mse_forces
  - mse_stress
  - mse_energy
  loss_property_weights:
  - 50.0
  - 5.0
  - 0.5
  - 0.01
  loss_huber_delta:
  - 0.01
  - 0.01
  - 0.01
  - 0.01
model:
  config:
    _target_: tace.models.e3nnTACE
    wrapper:
      _target_: tace.models.TensorModel
    cutoff: 6.0
    max_neighbors: null
    atomic_numbers: null
    fidelity:
    - name: PBEsol
      atomic_energy: null
    - name: PBE
      atomic_energy: null
    - name: PBEU
      atomic_energy: null
    - name: HSE_PBE
      atomic_energy: null
    - name: HSE_PBEsol
      atomic_energy: null
    - name: HSEsoc_PBEsol
      atomic_energy: null
    node_embedding:
      type: linear
    edge_embedding:
      type: identity
    edge_update:
      type: element2
    mmax: 2
    Lmax: 3
    lmax: 3
    mag_Lmax: 1
    num_layers: 3
    num_channel: 64
    parity: false
    radial_basis:
      radial_basis: j0
      num_radial_basis: 8
      num_mag_radial_basis: 10
      distance_transform: null
      cutoff_fn: c2poly
      polynomial_cutoff: 5
      gaussian_width: 2.0
      order: 0
      trainable: false
      apply_cutoff: false
      hidden:
      - 64
      - 64
      bias: true
      use_dydynamic_cutoff: false
      dydynamic_cutoff_mu: 40
      r_min: 0.0
    resnet:
      type: BB
      linear_type: identity
      use_first_resnet: false
    layer_norm:
      pre_norm_type: null
      final_norm_type: null
      use_first_pre_norm: false
    atomic_basis:
      type:
      - cgtp
      - uv_so2
      - uv_so2
      l1l2: null
      scatter_norm: avg_num_neighbors
      nonlinear: sigmoid_gate
      edge_nonlinear: so2_sigmoid_gate
      node_wise_hidden: null
      edge_wise_hidden: null
      edge_ace_hidden: 32
      num_head: 4
      use_o2_asymmetric_contraction: false
      use_radial_rotary_attention: false
      gate_m0: false
      scalar_act: null
      tensor_act: null
    product_basis:
      type: cgtp
      l1l2: null
      correlation: 2
      return_components: null
      num_expert: null
      num_channel_per_expert: null
      nonlinear: silu_bilineargate
      use_shared_expert: false
      agnostic: true
    readout_emlp:
      bias: false
      hidden:
      - 16
      use_alllayer: false
      use_uie: false
      use_one_body_magmoms: true
    scale_shift:
      enable: true
      scale_type: rms_forces
      shift_type: null
      scale_trainable: false
      shift_trainable: false
      all_atoms: false
      scale_zbl: false
    short_range:
      zbl:
        enable: false
        trainable: false
    long_range:
      les:
        enable: false
        les_arguments:
          n_layers: 3
          n_hidden:
          - 32
          - 16
          add_linear_nn: true
          output_scaling_factor: 0.1
          sigma: 1.0
          dl: 2.0
          remove_self_interaction: true
          remove_mean: true
          epsilon_factor: 1.0
          use_atomwise: false
          compute_bec: false
          bec_output_index: null
          use_dipole: false
          use_quad: false
          use_induced_charge: false
          use_induced_dipole: false
          use_anisotropic_polarizability: false
          alpha_irreps: 0e+1o+2e
          alpha_1o_nonlinear_readout: false
          alpha_1o_linear_w_pos: true
          make_alpha_positive: false
          make_kappa_positive: false
          output_scale: 0.1
          kappa_scale: 0.01
          alpha_scale: 0.01
    universal_embedding:
      charges:
        enable: false
      total_charge:
        enable: true
      electric_field:
        enable: false
        normalizer: 1.0
      magnetic_field:
        enable: false
        normalizer: 1.0
      initial_noncollinear_magmoms:
        enable: false
        normalizer: 1.0
    special:
      charges:
        method: lagrangian
    dropout:
      use_first_dropout: false
      stochastic_depth: 0.0
